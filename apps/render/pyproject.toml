[project]
name = "webmap-render"
version = "0.1.0"
description = "Playwright render service. Headless Chromium running real MapLibre GL JS."
requires-python = ">=3.12"
dependencies = [
    "webmap-core",
    "fastapi>=0.115",
    "pillow>=11.0",
    "playwright>=1.49",
    "uvicorn[standard]>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webmap_render"]
