[project]
name = "webmap-worker"
version = "0.1.0"
description = "arq worker. Geoprocessing, ingest, sync, export."
requires-python = ">=3.12"
dependencies = [
    "webmap-core",
    "webmap-geo",
    "webmap-io",
    "arq>=0.26",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webmap_worker"]
