[project]
name = "webmap-mcp"
version = "0.1.0"
description = "Local stdio MCP server. A thin HTTP client of webmap-api, trusted with nothing."
requires-python = ">=3.12"

# Deliberately short. This process runs on the user's workstation where they
# can read and modify it (adr/0008-local-stdio-mcp.md), so it holds no
# database driver, no service credential, and no shared domain code — an
# import-linter contract in the root pyproject enforces that.
dependencies = [
    "httpx>=0.28",
    "mcp>=1.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
]

[project.optional-dependencies]
# Windows credential broker. Entra ID path (03-auth-security.md §4.3); the
# on-prem AD fallback swaps this for httpx-gssapi over SSPI.
broker = ["msal>=1.31"]

[project.scripts]
webmap-mcp = "webmap_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webmap_mcp"]
