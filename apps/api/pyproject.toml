[project]
name = "webmap-api"
version = "0.1.0"
description = "The control plane. FastAPI. Enforces authorization."
requires-python = ">=3.12"
dependencies = [
    "webmap-core",
    "webmap-geo",
    "webmap-io",
    "alembic>=1.14",
    "arq>=0.26",
    "authlib>=1.4",
    "fastapi>=0.115",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "psycopg[binary]>=3.2",       # sync driver, for Alembic only
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webmap_api"]
