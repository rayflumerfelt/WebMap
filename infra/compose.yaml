# Local stack. `01-architecture.md` §6: two environments, not four.
#
# Six containers: Postgres and Redis for the control plane and queue, MinIO
# for object storage, TiTiler for COG raster tiles, plus the API and worker.
# The render container is behind the `render` profile because it is ~2 GB and
# Phase 3 is the first phase that needs it.
#
# There is no Martin and no vector tile service — MVT is generated in-process
# by the API from GeoParquet via DuckDB (adr/0002-duckdb-data-plane.md).

name: webmap

x-app-env: &app-env
  WEBMAP_ENVIRONMENT: local
  WEBMAP_DATABASE_URL: postgresql+asyncpg://webmap_app:webmap@postgres:5432/webmap
  WEBMAP_MIGRATION_DATABASE_URL: postgresql+psycopg://webmap_migrator:webmap@postgres:5432/webmap
  WEBMAP_REDIS_URL: redis://redis:6379/0
  WEBMAP_S3_ENDPOINT: http://minio:9000
  WEBMAP_S3_BUCKET: webmap
  WEBMAP_S3_ACCESS_KEY: minioadmin
  WEBMAP_S3_SECRET_KEY: minioadmin
  WEBMAP_TITILER_URL: http://titiler:8000
  WEBMAP_LOG_LEVEL: INFO

services:
  postgres:
    image: postgres:16-alpine
    # No PostGIS. Nothing in the control plane is spatial except
    # dataset.bbox_4326, which is four floats (adr/0002).
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: webmap
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the two roles the design requires: an application role that
      # cannot bypass RLS, and a separate privileged role for migrations.
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webmap"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/webmap &&
      echo 'bucket ready'
      "
    restart: "no"

  titiler:
    image: ghcr.io/developmentseed/titiler:0.21.0
    # Serves COGs with dynamic colormap application — changing a palette is a
    # URL parameter change, not a regrid (01 §2.5). Behind the API's auth
    # proxy in production; published here only so the local stack is
    # debuggable.
    environment:
      CPL_TMPDIR: /tmp
      GDAL_CACHEMAX: "200"
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      VSI_CACHE: "TRUE"
      AWS_S3_ENDPOINT: minio:9000
      AWS_HTTPS: "NO"
      AWS_VIRTUAL_HOSTING: "FALSE"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "8001:8000"

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    # Migrations run as the privileged role before the API starts. The API
    # then refuses to boot unless it can prove RLS is enforced
    # (03-auth-security.md §3.5).
    command: >
      /bin/sh -c "
      uv run --frozen alembic upgrade head &&
      uv run --frozen uvicorn webmap_api.main:app --host 0.0.0.0 --port 8000
      "
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build:
      context: ..
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command: ["uv", "run", "--frozen", "arq", "webmap_worker.main.WorkerSettings"]

  render:
    profiles: ["render"]
    build:
      context: ..
      dockerfile: infra/docker/render.Dockerfile
    environment:
      <<: *app-env
    ports:
      - "8002:8002"
    # 03-auth-security.md §7.3: render workers reach the tile, glyph, sprite,
    # and object-storage services and nothing else. Not the database, not the
    # API, not the internet. Compose cannot express egress rules, so the real
    # deployment enforces this at the network layer — this comment is here so
    # that requirement is not lost between here and there.

volumes:
  postgres-data:
  minio-data:
