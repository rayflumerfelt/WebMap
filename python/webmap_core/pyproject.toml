[project]
name = "webmap-core"
version = "0.1.0"
description = "Models, services, permissions, and style compilation shared by the API and the worker."
requires-python = ">=3.12"
dependencies = [
    "webmap-geo",
    "asyncpg>=0.30",
    "numpy>=2.0",
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webmap_core"]
