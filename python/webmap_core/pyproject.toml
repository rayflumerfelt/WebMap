[project]
name = "webmap-core"
version = "0.1.0"
description = "Models, services, permissions, and style compilation shared by the API and the worker."
requires-python = ">=3.12"
dependencies = [
    "webmap-geo",
    # Undeclared until gridding needed it, and it worked only because the uv
    # workspace installs everything: services/ingest.py and services/gridding.py
    # both import webmap_io inside their functions. A webmap-core wheel
    # installed on its own would have failed at the first upload.
    "webmap-io",
    "asyncpg>=0.30",
    "numpy>=2.0",
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webmap_core"]
