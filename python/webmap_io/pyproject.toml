[project]
name = "webmap-io"
version = "0.1.0"
description = "Format readers and writers, and the connector abstraction."
requires-python = ">=3.12"
dependencies = [
    "webmap-geo",
    "boto3>=1.35",
    "numpy>=2.0",
    "orjson>=3.10",
    "pyarrow>=18.0",
    "pyogrio>=0.10",
    "rasterio>=1.4",
    "shapely>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webmap_io"]
