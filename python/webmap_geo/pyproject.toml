[project]
name = "webmap-geo"
version = "0.1.0"
description = "Interpolation, contouring, aggregation, and the DuckDB data plane. Pure computation."
requires-python = ">=3.12"

# 05-geoprocessing.md §1. Every dependency here is load-bearing and reviewed
# (CLAUDE.md §7.2) — this package is deliberately isolated so its heavy
# dependencies do not reach the API container.
dependencies = [
    "duckdb>=1.5",         # data plane: GeoParquet reads, spatial ops, MVT
    "numpy>=2.0",
    "scipy>=1.14",
    "shapely>=2.0",
    "contourpy>=1.3",      # contour extraction (matplotlib's engine)
    "gstools>=1.6",        # variogram models, random fields
    "scikit-gstat>=1.0",   # experimental variogram estimation, binning
    "triangle>=20230923",  # Shewchuk constrained Delaunay
    "pyamg>=5.2",          # algebraic multigrid for sparse solves
    "pyproj>=3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webmap_geo"]
