# Alembic configuration. `02-data-model.md` is the contract these migrations
# must match; the DDL there is authoritative.
[alembic]
script_location = infra/migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os
# Timestamped, ordered filenames. A migration set ordered only by random hex
# revision ids is unreadable in a directory listing.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# sqlalchemy.url is set in env.py from WEBMAP_MIGRATION_DATABASE_URL.
# Migrations run as a separate privileged role from the application role,
# which must not have BYPASSRLS (02 §4).

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
